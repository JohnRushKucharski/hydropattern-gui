[project]
name = "hydropattern-gui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JohnRushKucharski", email = "johnkucharski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "climate-canvas==0.1.0",
    "hydropattern==0.0.0",
    "psutil>=6.0.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
hydropattern-gui = "hydropattern_gui:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pyinstaller>=6.21.0",
    "pylint>=3.3.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.3.1",
    "ruff>=0.15.20",
    "types-psutil>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 60
timeout_method = "thread"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".github", ".venv", ".pytest_cache", ".mypy_cache", ".ruff_cache", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]

[tool.pylint.main]
ignore-paths = [".github", ".venv", "build", "dist"]

[tool.pylint.messages_control]
disable = [
    "broad-exception-caught",
    "consider-using-with",
    "import-outside-toplevel",
    "line-too-long",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-few-public-methods",
]

[[tool.mypy.overrides]]
module = "hydropattern.*"
ignore_missing_imports = true

[tool.uv.sources]
climate-canvas = { path = "../climate-canvas", editable = true }
hydropattern = { path = "../hydropattern", editable = true }
